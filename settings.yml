use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  image_proxy: false
  allowed_hosts:
    - "searxng-neuroflow-v2.onrender.com"

search:
  formats:
    - html
    - json

botdetection:
  ip_limit:
    filter_on: false
  ip_lists:
    filter_on: false

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
